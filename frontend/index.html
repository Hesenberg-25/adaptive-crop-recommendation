<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgriVision - AI-powered Adaptive Crop Recommendation System for Smart Farming" />
    <title>AgriVision | Smart Farming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Forcefully hide Google Translate Banner and Iframe */
      iframe.goog-te-banner-frame,
      .skiptranslate > iframe.goog-te-banner-frame,
      #goog-gt-tt,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      iframe[id^=":1.container"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
      }
      /* Prevent the page from being pushed down by inline styles */
      html, body {
        top: 0 !important;
        margin-top: 0 !important;
        position: static !important;
      }
      /* Remove the translate hover effects */
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Hidden Google Translate init element — the visible dropdown is custom in React -->
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,mr,ta,te,kn,gu,bn,pa,ml,or,ur,as,ne,sd',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
